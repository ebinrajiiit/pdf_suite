name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/check-version.mjs
      - run: pnpm check:licenses
      - run: pnpm check:notices
      - run: pnpm exec playwright install --with-deps chromium
      # Not in the repo (large, third-party). apps/web/ocr-assets.ts copies it
      # into the build when it is present and only warns when it is not, so
      # without this the OCR test fails on a 404 nobody sees.
      - run: node scripts/fetch-tessdata.mjs eng mal hin
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The desktop shell is a separate job: it needs a Rust toolchain and platform
  # libraries, takes minutes rather than seconds, and nothing else depends on it.
  # A broken web app should fail in `check` within a minute, not behind a Rust
  # compile.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      # `frontendDist` points at apps/web/dist, and tauri-build fails the
      # compile when that path does not exist — so the shell cannot be
      # checked before the interface it wraps has been built.
      - run: pnpm build
      # cargo check, not a full bundle: this answers "does the shell still
      # compile" on every platform without spending minutes on installers.
      # Every crate here ships inside the binary a customer installs, so it
      # needs the same allow-list as the npm and wasm dependencies.
      - run: pnpm check:licenses:rust
      # The notices file lists every crate, generated from a snapshot so the web
      # job needs no Rust. This is where the snapshot is proved current.
      - name: Crate licence snapshot is current
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm licences:rust:snapshot
          git diff --exit-code --stat scripts/rust-licences.json             || (echo "scripts/rust-licences.json is stale. Run: pnpm licences:rust:snapshot" && exit 1)
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
