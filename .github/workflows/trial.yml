name: Trial

# The public try-it-out copy: the same app, built so that it cannot write a
# file. Rebuilt on every push to main, verified, then published.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Writing a branch, not deploying through the Pages API: creating a Pages site
# needs admin, which the workflow token does not have, and that is what
# configure-pages kept failing on. Pushing a branch needs contents: write, which
# the release job already proves this token has.
permissions:
  contents: write

# One deployment at a time, and never cancel one half-done.
concurrency:
  group: trial
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    env:
      SIGNET_TRIAL: "1"
      # Where the dialog sends someone who wants to keep their work. Change it
      # with the repository that holds the installers.
      SIGNET_DOWNLOAD_URL: https://github.com/${{ vars.DOWNLOADS_REPO || github.repository }}/releases/latest
      # Pages serves a project site from /<repo>/, so the build has to know it.
      SIGNET_BASE: /pdf_suite/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-tessdata.mjs eng mal hin
      - run: pnpm build

      # Published only if it really does refuse to hand a file over. A trial
      # that quietly saves is worse than no trial: it gives away the product
      # and tells the visitor nothing about why they would install it.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test trial.spec.ts

      # The offline guarantee is the claim being demonstrated, so the demo has
      # to keep it too.
      - run: pnpm exec playwright test offline.spec.ts -g "works with the network cut"

      # A plain branch push rather than an action: ten lines, no third-party
      # step in a pipeline whose whole subject is not trusting other people's
      # servers. The branch holds only build output and is replaced each time.
      - name: Publish to the gh-pages branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd apps/web/dist
          # Without this, Jekyll would try to build the site and drop anything
          # whose name begins with an underscore.
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Trial build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Pushed. Settings > Pages > Deploy from a branch > gh-pages > / (root)"

      # The branch above is only served once someone points Pages at it. Where
      # DEMO_REPO names a repository whose Pages are already working, publish
      # there as well and the demo updates itself with no setting to find.
      - name: Publish the demo where Pages already works
        if: vars.DEMO_REPO != ''
        env:
          TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          DEMO_REPO: ${{ vars.DEMO_REPO }}
          DEMO_PATH: ${{ vars.DEMO_PATH }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::DEMO_REPO is set but DOWNLOADS_TOKEN is empty."
            exit 1
          fi
          if [ -z "$DEMO_PATH" ]; then
            echo "::error::DEMO_REPO is set but DEMO_PATH is not — it names the folder to serve from."
            exit 1
          fi

          # Built a second time: this copy lives at a different base path from
          # the gh-pages one, and every asset path is baked in at build time.
          SIGNET_BASE="/$DEMO_PATH/" pnpm build

          git clone --quiet --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/${DEMO_REPO}.git" demo-site
          rm -rf "demo-site/$DEMO_PATH"
          mkdir -p "demo-site/$DEMO_PATH"
          cp -R apps/web/dist/. "demo-site/$DEMO_PATH/"
          # So the wasm, the service worker and the language data are served as
          # built rather than passed through Jekyll.
          touch demo-site/.nojekyll

          cd demo-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Vite names assets by content hash, so an unchanged build is a
          # genuinely empty diff and deserves no commit.
          if git diff --cached --quiet; then
            echo "Demo unchanged; nothing to push."
            exit 0
          fi
          git commit -q -m "Signet demo from ${GITHUB_SHA}"
          git push --quiet
          echo "Demo updated in ${DEMO_REPO} under /${DEMO_PATH}/"
