name: Release

# A tag publishes. A manual run builds everything and publishes nothing, so the
# pipeline can be proved without spending a version number on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Not in the repo: large, and third-party Apache-2.0 data. A release has to
  # carry it rather than fetch it later — the desktop shell has no HTTP
  # permission at all (ADR 0005) and the web app's CSP is `connect-src 'self'`,
  # so neither can reach a language pack that is not on its own origin. Both
  # builds copy vendor/tessdata into the bundle; see apps/web/ocr-assets.ts.
  TESSDATA_LANGS: eng mal hin

jobs:
  web:
    name: PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-tessdata.mjs $TESSDATA_LANGS
      - run: pnpm build

      # ocr-assets.ts only warns when the language data is absent, which is right
      # for a dev build and wrong for a release: OCR is one of the three reasons
      # docs/PRODUCT.md gives for choosing this over Acrobat, and it would 404 in
      # the hands of a user who cannot see the build log.
      - name: The bundle carries its OCR data
        run: |
          for lang in $TESSDATA_LANGS; do
            test -s "apps/web/dist/ocr/lang/$lang.traineddata" ||
              { echo "missing: dist/ocr/lang/$lang.traineddata"; exit 1; }
          done
          test -s apps/web/dist/ocr/worker.min.js
          ls apps/web/dist/ocr/core/*.wasm.js

      # The PWA is self-hosted by whoever deploys it, so the artifact is the
      # directory to serve, with the notices beside it.
      - name: Pack the PWA
        run: |
          cp THIRD_PARTY_NOTICES.txt apps/web/dist/
          tar -czf signet-web.tar.gz -C apps/web/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: signet-web.tar.gz
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      # Every platform's result is wanted: one of them failing is the news, and
      # cancelling the others hides whether it is specific to that platform.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # One .dmg for both Intel and Apple silicon: an office has a mix, and
          # choosing the wrong download is a support request.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-tessdata.mjs $TESSDATA_LANGS
        shell: bash

      # tauri build runs the web build itself (beforeBuildCommand), so the
      # bundle picks up the language data fetched above.
      - name: Build the bundle (universal)
        if: matrix.os == 'macos-latest'
        run: pnpm --filter @pdf-suite/desktop exec tauri build --target universal-apple-darwin
      - name: Build the bundle
        if: matrix.os != 'macos-latest'
        run: pnpm --filter @pdf-suite/desktop exec tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          # Both layouts: a --target build nests one directory deeper.
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish
    needs: [web, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: The tag is the version that was built
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

      # A university installing an unsigned binary should be able to check it
      # against something. Neither bundle is code-signed yet, so this is the
      # only integrity claim a release can honestly make.
      - name: Collect and checksum
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' \
               -o -name '*.AppImage' -o -name '*.tar.gz' \) \
            -exec cp {} release/ \;
          cp THIRD_PARTY_NOTICES.txt release/
          cd release
          shasum -a 256 * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      # The downloads live wherever DOWNLOADS_REPO says, so moving them is a
      # repository setting rather than a commit. Unset, they stay here.
      #
      # Publishing to another repository needs a token that can write to it —
      # github.token reaches only this one — so DOWNLOADS_TOKEN must be a
      # fine-grained PAT with Contents: read and write on the target. The tag
      # need not exist there: GitHub creates it against that repo's default
      # branch, which is why the target needs at least one commit.
      # A 403 from `gh release create` says "Resource not accessible", which is
      # true of a missing secret, a secret added as a variable, and a token
      # without Contents: write — three different fixes. This says which.
      - name: The token can write where the downloads go
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN || github.token }}
          TARGET: ${{ vars.DOWNLOADS_REPO || github.repository }}
          HAVE_TOKEN: ${{ secrets.DOWNLOADS_TOKEN != '' }}
        run: |
          echo "Publishing to $TARGET"
          if [ "$TARGET" = "$GITHUB_REPOSITORY" ]; then
            echo "Same repository as the build; the built-in token is enough."
            exit 0
          fi
          if [ "$HAVE_TOKEN" != "true" ]; then
            echo "::error::DOWNLOADS_REPO is $TARGET but DOWNLOADS_TOKEN is empty."
            echo "::error::It has to be a SECRET, not a variable — Settings > Secrets and variables > Actions > the Secrets tab."
            exit 1
          fi
          # Not `repos/$TARGET --jq .permissions.push`: that reports the
          # USER's access to the repository, not the token's scopes. The owner
          # of a repository reads back push: true through a token holding no
          # Contents permission at all, which is how a 403 reached the publish
          # step with a green check above it.
          #
          # So probe the capability itself. A draft release creates no tag and
          # is deleted immediately; nothing is published by asking.
          if ! ID=$(gh api -X POST "repos/$TARGET/releases" \
                      -f "tag_name=preflight-$GITHUB_RUN_ID" -F draft=true \
                      --jq .id 2>&1); then
            echo "::error::DOWNLOADS_TOKEN cannot create a release in $TARGET."
            echo "::error::Give it Repository permissions > Contents: Read and write."
            echo "::error::Releases live under Contents. Actions, Administration, Secrets and Workflows do not cover them."
            echo "$ID"
            exit 1
          fi
          gh api -X DELETE "repos/$TARGET/releases/$ID" --silent
          echo "Token can create releases in $TARGET."

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN || github.token }}
          TARGET: ${{ vars.DOWNLOADS_REPO || github.repository }}
        run: |
          echo "Publishing $GITHUB_REF_NAME to $TARGET"
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$TARGET" \
            --title "Signet $GITHUB_REF_NAME" \
            --notes-file - <<'NOTES'
          Every operation runs on your own device. No document, page, extracted
          text or derived data leaves the machine.

          | Download | For |
          | --- | --- |
          | `.dmg` | macOS, Intel and Apple silicon in one file |
          | `.msi` | Windows |
          | `.deb` / `.AppImage` | Linux |
          | `signet-web.tar.gz` | the PWA, to serve from your own host |

          Neither bundle is code-signed yet, so macOS and Windows will warn.
          Check `SHA256SUMS` against your download.

          The OCR language data for English, Malayalam and Hindi is inside each
          build, which is why they are large.
          NOTES

      # Asset names carry the version, so a download link written by hand rots
      # at the next release — and a dead link on the page a stranger lands on
      # is worse than no link. Rewritten from the release just published.
      - name: Refresh the download links
        if: vars.DOWNLOADS_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN || github.token }}
          TARGET: ${{ vars.DOWNLOADS_REPO }}
        run: |
          git clone --quiet --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${TARGET}.git" download-page
          gh api "repos/$TARGET/releases/tags/$GITHUB_REF_NAME" \
            | node scripts/download-table.mjs "$GITHUB_REF_NAME" --into download-page/README.md
          cd download-page
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Download links already current."
            exit 0
          fi
          git commit -qam "Download links for ${GITHUB_REF_NAME}"
          if ! git push --quiet 2>push.err; then
            cat push.err
            echo "::error::DOWNLOADS_TOKEN published the release to $TARGET but cannot push to it."
            echo "::error::Releases and commits are both Contents; check the token still selects that repository."
            exit 1
          fi
          echo "Download links in $TARGET now point at $GITHUB_REF_NAME."
